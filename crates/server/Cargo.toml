[package]
name = "self-dis-server"
version = "0.1.0"
edition = "2021"
description = "Closed community server: chat, rooms, and later WebRTC voice"
license = "MIT"

[lib]
name = "self_dis_server"
path = "src/lib.rs"

[[bin]]
name = "self-dis"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "json", "tokio"] }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", features = ["sink"] }
getrandom = "0.4.3"
rpassword = "7.5.4"
self-dis-protocol = { path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
